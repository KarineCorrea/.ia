<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding-top: 100px;
        }

        .card {
            background: white;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        p {
            color: #666;
        }

        button {
            background: #ff7a00;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #e66d00;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Olá, Karine! 👋</h1>

        <p>Minha primeira página usando IA.</p>

        <button onclick="mostrarMensagem()">
            Clique aqui
        </button>
    </div>

    <script>
        function mostrarMensagem() {
            alert("Calmaaaa a IA logo resolve, aguarde próximo passo! 🎉");
        }
    </script>

</body>
</html>
